name: test

on:
  push:
  pull_request:
  schedule:
    # Run regularly with fresh data
    - cron: '0 6,18 * * *'

env:
  FORCE_COLOR: 3

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - run: sudo apt-get update -qq
    - run: sudo apt-get install -qq -y --no-install-recommends coinor-cbc tidy $(cat packages.txt)
    - uses: actions/setup-python@v7
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "requirements**.txt"
    - run: uv venv
    - run: uv pip install -r requirements-dev.txt
    # The CMI spreadsheets are immutable, so a fixed key suffices.  Keep in
    # sync with cmi_editions in data/mortality.py
    - name: Cache CMI mortality spreadsheets
      uses: actions/cache@v6
      with:
        path: |
          data/Unisex%20mortality%20rates%20for%202026-2027%20illustrations%20v01%202025-10-17_0.xlsx
          data/Unisex%20mortality%20rates%20for%202027-2028%20illustrations%20v01%202026-10-14.xlsx
        key: cmi-unisex-mortality-2026-2027-v01-2025-10-17-2027-2028-v01-2026-10-14
    - run: uv run pre-commit run --show-diff-on-failure --color always --all-files --hook-stage pre-commit
    - run: uv run pytest -n auto --cov=. --junitxml=junit.xml -o junit_family=legacy
    - run: uv run coverage xml
      if: ${{ !cancelled() }}
    - uses: codecov/codecov-action@v7
      if: ${{ !cancelled() }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - uses: codecov/codecov-action@v7
      if: ${{ !cancelled() }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results
